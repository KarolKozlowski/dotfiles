# Cache settings
default-cache-ttl 14400
max-cache-ttl 7200

# Pinentry program (TTY-based)
#pinentry-program /usr/bin/pinentry-tty
pinentry-program /usr/bin/pinentry-curses

# Enable SSH support via gpg-agent instead of ssh-agent
# To use:
#   - Start gpg-agent at login (e.g. in shell init).
#   - Export SSH_AUTH_SOCK from gpgconf:
#       export SSH_AUTH_SOCK="$(gpgconf --list-dirs agent-ssh-socket)"
#   - Export GPG_TTY:
#       export GPG_TTY="$(tty)"
#   - Optionally update TTY after switching sessions:
#       gpg-connect-agent updatestartuptty /bye >/dev/null
# enable-ssh-support
